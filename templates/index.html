<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>random.exe group — yt downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=999" />
</head>
<body>
  <div class="noise"></div>
  <div class="scanlines"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">R<span class="dot">.</span>E<span class="dot">.</span>X</span>
      <span class="brand-sub">random.exe group</span>
    </div>
    <div class="status">
      <span class="pulse"></span>
      <span>online</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="kicker"><span class="kicker-line"></span>self-hosted / no logs</p>
      <h1>pull the feed.<br /><em>own the file.</em></h1>
    </section>

    <section class="search">
      <div class="search-frame">
        <input id="urlInput" type="text" placeholder="paste a youtube url…" autocomplete="off" spellcheck="false" />
        <button id="fetchBtn" class="fetch-btn">fetch</button>
      </div>
    </section>

    <div id="error" class="error hidden">
      <span class="error-icon">!</span>
      <span id="errorText"></span>
    </div>

    <section id="videoCard" class="video-card hidden">
      <div class="thumb-wrap">
        <img id="thumbnail" alt="" />
        <span id="duration" class="duration"></span>
      </div>
      <div class="video-details">
        <h2 id="videoTitle"></h2>
        <p id="videoUploader" class="uploader"></p>
      </div>
    </section>

    <section id="optionsCard" class="options-card hidden">
      <button id="downloadBtn" class="execute-btn">
        <span class="exec-text">download</span>
      </button>
    </section>

    <section id="progressCard" class="progress-card hidden">
      <div class="progress-head">
        <span class="progress-dot"></span>
        <span id="progressText">initializing…</span>
        <span id="progressPct" class="progress-pct">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <p id="progressMeta" class="progress-meta"></p>
      <a id="downloadLink" class="download-link hidden" href="#">download file →</a>
    </section>
  </main>

  <footer class="site-footer">
    no logs. no limits. no bullshit.
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}?v=999" defer></script>
</body>
</html>
